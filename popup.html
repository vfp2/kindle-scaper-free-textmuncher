<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #232f3e;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #startBtn {
      background: #ff9900;
      color: #111;
    }
    #startBtn:hover {
      background: #e88b00;
    }
    #startBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      font-size: 13px;
      color: #555;
      margin-top: 8px;
      min-height: 20px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.active {
      display: block;
    }
    .progress-fill {
      height: 100%;
      background: #ff9900;
      width: 0%;
      transition: width 0.3s;
    }
    .note {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>📚 Kindle to Markdown</h1>
  <p style="font-size: 13px; color: #666; margin: 0 0 12px 0;">
    Open a book in Kindle Cloud Reader, then click below to export it as Markdown.
  </p>
  <button id="startBtn">Start Export</button>
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div id="status">Ready</div>
  <div class="note">
    The extension will automatically turn pages and collect all text and images.
    This may take several minutes for large books.
  </div>
  <script src="popup.js"></script>
</body>
</html>
